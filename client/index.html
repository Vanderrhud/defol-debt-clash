<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DEFOL: Debt Clash</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; }

    #game-container { width: 100%; height: 100%; }

    /* Rotate prompt overlay — hidden by default, shown via JS in portrait */
    #rotate-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #111;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #rotate-overlay.visible { display: flex; }

    .rotate-icon {
      font-size: 60px; margin-bottom: 20px;
      animation: rotate-phone 2s ease-in-out infinite;
    }
    .rotate-text {
      color: #fff; font-size: 18px; text-align: center; line-height: 1.5;
    }
    .rotate-sub {
      color: #888; font-size: 13px; margin-top: 8px; text-align: center;
    }

    @keyframes rotate-phone {
      0%   { transform: rotate(0deg); }
      25%  { transform: rotate(-90deg); }
      75%  { transform: rotate(-90deg); }
      100% { transform: rotate(0deg); }
    }
  </style>
</head>
<body>
  <div id="rotate-overlay">
    <div class="rotate-icon">📱</div>
    <div class="rotate-text">Please rotate your device<br/>to landscape</div>
    <div class="rotate-sub">Game requires landscape orientation</div>
  </div>

  <div id="game-container"></div>

  <script src="/node_modules/phaser/dist/phaser.min.js"></script>
  <script src="/client/js/Player.js"></script>
  <script src="/client/js/scenes/BootScene.js"></script>
  <script src="/client/js/scenes/GameScene.js"></script>
  <script src="/client/js/game.js"></script>
</body>
</html>
